name: "Build Picture Viewer diagnostic draft release"

on:
  workflow_dispatch:
  push:
    branches:
      - diag-0.1.60
    paths:
      - "script.jjs.pictureviewer/**"
      - ".github/workflows/build-diag.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and build diagnostic ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile script.jjs.pictureviewer/default.py script.jjs.pictureviewer/resources/lib/viewer.py
          VERSION="$(python - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse("script.jjs.pictureviewer/addon.xml").getroot().attrib["version"])
          PY
          )"
          ZIP="script.jjs.pictureviewer-${VERSION}.zip"
          rm -rf script.jjs.pictureviewer/__pycache__ script.jjs.pictureviewer/resources/lib/__pycache__
          zip -qr "$ZIP" script.jjs.pictureviewer -x "*/__pycache__/*" "*.pyc"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create private diagnostic draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="diag-${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ZIP" \
            --target "${GITHUB_SHA}" \
            --title "JJS Kodi Picture Viewer ${VERSION}" \
            --notes "Diagnostic build. Not a public release." \
            --draft
